# docs-site（Astro + Starlight の docs サイト）は workspace に入れる。lockfile が 1 本で済み、
# root の pnpm install が docs の依存も入れる。upstream/ の 2 つは自分の yarn で build するので入れない。
# Dockerfile は docs-site/ を写さずに install するが、そのとき入るのは root の依存だけで、frozen でも通る。
packages:
  - "docs-site"

# pnpm audit が見逃してよい勧告。この repo では直せず、届きもしないものだけを置く。
# **足すなら、なぜ・いつ外すかを一緒に書くこと。**
#
#   GHSA-g3hv-75wg-m249 — minimatch <11.0.1 の globparts の増幅による DoS。修正は 11.0.1 からで、
#     10 系には来ていない。要求元は eslint・@eslint/config-array・@typescript-eslint/typescript-estree
#     で、2026-11-05 の時点でどれの最新版も ^10 を求める (eslint ^10.2.6・config-array ^10.2.4・
#     typescript-estree ^10.2.2)。capture-ledger も同じ理由で外している。
#
#     届かない理由: どれも devDependencies の lint の道具で、image には入らない (Dockerfile で
#     依存を入れるのは build の段だけで、実行の段は node_modules を持たない)。読むパターンも
#     この repo の設定と lint の対象だけ。
#
#     外す条件: これらの親が 11.0.1 以上を求める版を出したとき (update で直る)。確かめ方は
#     `pnpm why minimatch`。
#
#   GHSA-fc5q-39xc-vjpf — picomatch: 単一の枝を繰り返す extglob (`+(*)` など) の ReDoS (high)。
#     勧告の範囲は <= 4.0.7 で 2 系も含み、直った版はまだ無い (2026-11-18 の時点で npm の
#     最新は 4.0.7。直しの PR は micromatch/picomatch の #265〜#273 で未 merge)。上げる先が
#     無いので、lockfile の更新でも override でも越えられない。
#
#     要求元は astro・@astrojs/internal-helpers・vite・vitest・tinyglobby・fdir・anymatch (2.3.2)。
#     `pnpm audit --prod` で残る経路は docs-site の Starlight の下だけで、docs は静的な HTML
#     として出る。picomatch が読むパターンは、build と試験の間のこの repo の設定と、
#     Astro・vite の内部の物だけで、外の入力は入らない。
#
#     外す条件: 勧告に直った版 (first_patched_version) が載ったとき。
#     `pnpm update picomatch -r --depth Infinity` で上げ、この行を消しても `pnpm audit` が 0 に
#     なれば消す (CAPTURE-478)。
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
    - GHSA-fc5q-39xc-vjpf
