# pnpm audit が見逃してよい勧告。この repo では直せず、届きもしないものだけを置く。
# **足すなら、なぜ・いつ外すかを一緒に書くこと。**
#
#   GHSA-g3hv-75wg-m249 — minimatch <11.0.1 の globparts の増幅による DoS。修正は 11.0.1 からで、
#     10 系には来ていない。要求元は eslint・@eslint/config-array・@typescript-eslint/typescript-estree
#     で、2026-11-05 の時点でどれの最新版も ^10 を求める (eslint ^10.2.6・config-array ^10.2.4・
#     typescript-estree ^10.2.2)。capture-ledger も同じ理由で外している。
#
#     届かない理由: どれも devDependencies の lint の道具で、image には入らない (fetch の段は
#     `--prod`、実行の段は node_modules を持たない)。読むパターンもこの repo の設定と lint の
#     対象だけ。
#
#     外す条件: これらの親が 11.0.1 以上を求める版を出したとき (update で直る)。確かめ方は
#     `pnpm why minimatch`。
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
