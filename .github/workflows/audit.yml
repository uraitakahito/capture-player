# Known-vulnerability gate for pnpm-lock.yaml (the server's dev tools). Advisories
# this repository cannot fix are skipped in pnpm-workspace.yaml under
# auditConfig.ignoreGhsas, next to why and when to remove them. The viewer's own
# dependencies live in upstream/*/yarn.lock and are checked when upstream is
# pulled (docs/upstream.md). Keeping the exception there rather than in a
# flag here means a local `pnpm audit` gives the same answer as this job.
#
# Advisories are published independently of our pull requests, so this also
# runs every day. `schedule` and `workflow_dispatch` only run workflows that
# exist on the default branch (main); until this file is released, only
# pull_request and push apply.
#
# `pnpm audit` directly rather than through a package script: a direct command
# reads the lockfile without pnpm 11 installing everything first (it does that
# before any `pnpm run`).
name: audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      # The version comes from .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Audit the lockfile
        run: pnpm audit --audit-level=low
