# The docs site (docs-site/): build it and check its references — the en/ja
# pairs, every link in the built HTML, the repository paths the pages name, and
# the README's two URLs (scripts/check-doc-refs.mjs). Publishing is docs.yml,
# on a tag. Not narrowed by paths: the check also reads README.md and the
# files the pages name.
name: site

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Before setup-node: `cache: pnpm` needs pnpm on PATH to find the store.
      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      # The version comes from .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site and check its references
        run: pnpm run site:check
